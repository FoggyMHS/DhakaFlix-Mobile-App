
name: Build DhakaFlix Mobile

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this build as a GitHub Release?
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract mobile source ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/mobile"
          unzip -q DhakaFlix-Mobile-Source.zip -d "$RUNNER_TEMP/mobile"

          PROJECT_DIR=$(find "$RUNNER_TEMP/mobile" \
            -name settings.gradle -o -name settings.gradle.kts \
            | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "Mobile Gradle project not found in source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mobile APK
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi

          mkdir -p "$RUNNER_TEMP/output"
          cp app/build/outputs/apk/debug/app-debug.apk \
            "$RUNNER_TEMP/output/DhakaFlix-Mobile.apk"

      - name: Upload mobile APK
        uses: actions/upload-artifact@v4
        with:
          name: DhakaFlix-Mobile-Android
          path: ${{ runner.temp }}/output/DhakaFlix-Mobile.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.publish_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: DhakaFlix Mobile Build ${{ github.run_number }}
          generate_release_notes: true
          files: ${{ runner.temp }}/output/DhakaFlix-Mobile.apk
