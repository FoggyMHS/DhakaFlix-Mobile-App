
name: Build DhakaFlix Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Check signing secrets
        env:
          KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
          STORE: ${{ secrets.SIGNING_STORE_PASSWORD }}
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          test -n "$KEY" || exit 1
          test -n "$STORE" || exit 1
          test -n "$ALIAS" || exit 1
          test -n "$PASSWORD" || exit 1

      - name: Restore signing key
        env:
          KEY: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          echo "$KEY" | base64 --decode \
            > "$RUNNER_TEMP/release-key.jks"

      - name: Build release APK
        env:
          DHAKAFLIX_STORE_FILE: ${{ runner.temp }}/release-key.jks
          DHAKAFLIX_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          DHAKAFLIX_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          DHAKAFLIX_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DhakaFlix-Android-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
          
