
name: DhakaFlix - Extract ZIP and Deploy

on:
  push:
    branches:
      - main
    paths:
      - "DhakaFlix-GitHub-Pages-Package.zip"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract DhakaFlix ZIP
        run: |
          mkdir -p extracted
          unzip -o DhakaFlix-GitHub-Pages-Package.zip -d extracted

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: extracted/web

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        
