name: Build TV release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-tv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Unzip TV source
        run: unzip -q DhakaFlix-TV-Source.zip

      - name: Prepare signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "$SIGNING_KEY_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
            echo "SIGNING_KEYSTORE=$GITHUB_WORKSPACE/release.jks" >> "$GITHUB_ENV"
          else
            echo "No signing secrets found: building with the debug key."
          fi

      - name: Build
        working-directory: DhakaFlix-TV
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 versionName DhakaFlix-TV/app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          TAG="tv-v$VERSION"
          APK="DhakaFlix-TV-v$VERSION.apk"
          cp DhakaFlix-TV/app/build/outputs/apk/release/app-release.apk "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" --title "DhakaFlix TV v$VERSION" --notes "Android TV / Google TV build of DhakaFlix. Download the APK and install it on your TV." --latest=false
          fi
