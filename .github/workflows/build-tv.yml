
name: Build DhakaFlix Android TV

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish this build as a GitHub Release?
        required: true
        type: choice
        default: "no"
        options:
          - "no"
          - "yes"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract TV source ZIP
        run: |
          mkdir -p "$RUNNER_TEMP/tv"
          unzip -q DhakaFlix-TV-Source.zip -d "$RUNNER_TEMP/tv"

          PROJECT_DIR=$(find "$RUNNER_TEMP/tv" \
            -name settings.gradle -o -name settings.gradle.kts \
            | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ] || [ ! -d "$PROJECT_DIR" ]; then
            echo "TV Gradle project not found in source ZIP."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Configure signing
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            mkdir -p "$RUNNER_TEMP/signing"
            echo "$SIGNING_KEY_BASE64" | base64 --decode \
              > "$RUNNER_TEMP/signing/release-key.jks"

            echo "SIGNING_KEY_PATH=$RUNNER_TEMP/signing/release-key.jks" >> "$GITHUB_ENV"
          fi

      - name: Build TV APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

          mkdir -p "$RUNNER_TEMP/output"

          APK=$(find app/build/outputs/apk/release \
            -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "TV release APK not found."
            exit 1
          fi

          cp "$APK" "$RUNNER_TEMP/output/DhakaFlix-TV.apk"

      - name: Upload TV APK
        uses: actions/upload-artifact@v4
        with:
          name: DhakaFlix-TV-Android
          path: ${{ runner.temp }}/output/DhakaFlix-TV.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: inputs.publish_release == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-v${{ github.run_number }}
          name: DhakaFlix TV Build ${{ github.run_number }}
          generate_release_notes: true
          files: ${{ runner.temp }}/output/DhakaFlix-TV.apk
